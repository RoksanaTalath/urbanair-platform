version: '3.9'

services:
  # ── MongoDB ─────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: urbanair-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: urbanair
      MONGO_INITDB_ROOT_PASSWORD: urbanair_secret
      MONGO_INITDB_DATABASE: urbanair
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urbanair-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: mongodb://urbanair:urbanair_secret@mongodb:27017/urbanair?authSource=admin
      MONGODB_DB_NAME: urbanair
      WAQI_API_TOKEN: ${WAQI_API_TOKEN:-demo}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:3000","https://urbanair.vercel.app"]'
      DEBUG: "false"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (Vite dev server) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urbanair-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_WAQI_TOKEN: ${WAQI_API_TOKEN:-demo}
    depends_on:
      - backend

volumes:
  mongo_data:

networks:
  default:
    name: urbanair-network
